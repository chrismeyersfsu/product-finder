name: mcp

# Thin trigger: the logic lives in packages/mcp/ci.sh so CI is runnable
# and debuggable locally. List a package's own tree, its workspace
# dependencies, and the lockfile in `paths`.
on:
  push:
    paths:
      - "packages/mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "packages/mcp/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mcp.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: ./packages/mcp/ci.sh
