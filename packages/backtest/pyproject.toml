[project]
name = "product-finder-backtest"
version = "0.1.0"
description = "Pure backtest engine: best-deal-vs-waiting analysis over price observations"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_finder_backtest"]
