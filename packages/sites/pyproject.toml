[project]
name = "product-finder-sites"
version = "0.1.0"
description = "Site adapters: fetch and parse product listings from marketplace search pages"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_finder_sites"]
