[project]
name = "product-finder-mcp"
version = "0.1.0"
description = "MCP server: manage products, run searches, query deals, modify this project"
requires-python = ">=3.12"
dependencies = ["mcp>=2", "product-finder-core", "product-finder-sites"]

[project.scripts]
product-finder-mcp = "product_finder_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
product-finder-core = { workspace = true }
product-finder-sites = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_finder_mcp"]
