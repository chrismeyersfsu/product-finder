[project]
name = "product-finder-geo"
version = "0.1.0"
description = "Geocoding with a SQLite cache and great-circle distance for listing locations"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_finder_geo"]
