[project]
name = "myproj-core"
version = "0.1.0"
description = "One-line description of what this package owns"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
myproj = "myproj_core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproj_core"]
