[project]
name = "product-finder-core"
version = "0.1.0"
description = "Generic product-search domain: data model, SQLite storage, criteria scoring"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
product-finder = "product_finder_core.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_finder_core"]
