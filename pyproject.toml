[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
skip-magic-trailing-comma = true   # wrapping is length-driven only

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]                  # the formatter owns line length

[tool.ruff.lint.isort]
split-on-trailing-comma = false
